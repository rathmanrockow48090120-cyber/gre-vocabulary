let pdfTask;
function loadPDFTools(){
  if(!pdfTask)pdfTask=new Promise((resolve,reject)=>{
    const s=document.createElement('script');s.src='export-pdf.js';

"use strict";
const $=id=>document.getElementById(id), size=30, N=WORDS.length, last=Math.ceil(N/size), version="b67c0d589584", key="lexicon-progress-"+version;
let seen=new Set(), unknown=new Set(), page=0, rp=0, mode="test", busy=false, memoryOnly=false;
const valid=(a,max)=>Array.isArray(a)&&a.every(i=>Number.isInteger(i)&&i>=0&&i<max);
function unpack(s){
  if(!s||s.version!==version||!valid(s.seen,last)||!valid(s.unknown,N)||!Number.isInteger(s.page)||s.page<0||s.page>=last)throw Error("进度文件与本词库不匹配");
  seen=new Set(s.seen);unknown=new Set(s.unknown);page=s.page;
}
try{const value=localStorage.getItem(key);if(value)unpack(JSON.parse(value))}catch{memoryOnly=true}
const pack=()=>({version,page,seen:[...seen],unknown:[...unknown]});
function save(){try{localStorage.setItem(key,JSON.stringify(pack()))}catch{memoryOnly=true}}
const ids=()=>mode==="test"?Array.from({length:N},(_,i)=>i):[...unknown].sort((a,b)=>a-b);
const known=()=>Array.from({length:N},(_,i)=>i).filter(i=>seen.has(Math.floor(i/size))&&!unknown.has(i));
const icon=name=>ICONS[name];

function say(s){$("msg").textContent=s;clearTimeout(say.timer);say.timer=setTimeout(()=>$("msg").textContent="",5000)}
function goTop(){window.scrollTo(0,0)}
function render(focusIndex){
  const list=ids(), total=Math.max(1,Math.ceil(list.length/size));rp=Math.min(rp,total-1);const current=mode==="test"?page:rp;
  const sel=list.slice(current*size,current*size+size), reviewed=[...seen].reduce((s,p)=>s+Math.min(size,N-p*size),0), k=known().length;
  $("pending").textContent=unknown.size;$("stats").innerHTML=[[reviewed,"已测词条"],[k,"已储备"],[unknown.size,"不熟悉"]].map(([n,s])=>'<div><b>'+n.toLocaleString()+'</b><small>'+s+'</small></div>').join("");
  $("fill").style.width=100*reviewed/N+"%";$("stamp").textContent=memoryOnly?"进度仅在内存中":seen.size+" / "+last+" 页已确认";
  $("test").classList.toggle("on",mode==="test");$("review").classList.toggle("on",mode==="review");
  $("chapter").textContent=mode==="test"?"WORD LIST   /   "+String(page+1).padStart(3,"0"):"REVIEW   /   "+String(rp+1).padStart(3,"0");
  $("subtitle").textContent=mode==="test"?(seen.has(page)?"已确认词表":"本页词表"):"待复习词表";
  $("hint").textContent=sel.length?(current*size+1)+" – "+(current*size+sel.length)+" / "+list.length:"";
  const el=$("list");el.replaceChildren();
  for(const i of sel){
    const is=unknown.has(i), row=document.createElement("article");row.className="entry";
    row.innerHTML='<span class="num"></span><div><div class="word" lang="en"></div><div class="meaning"></div></div><button class="mark"></button>';
    row.querySelector(".num").textContent=String(i+1).padStart(4,"0");row.querySelector(".word").textContent=WORDS[i][0];
    row.querySelector(".meaning").textContent=is?WORDS[i][1]:"";row.querySelector(".meaning").hidden=!is;
    const b=row.querySelector("button");b.dataset.index=i;b.setAttribute("aria-pressed",is);b.setAttribute("aria-label",WORDS[i][0]+(is?"：已标记，点击改为认识":"：不熟悉，查看释义"));
    b.classList.toggle("marked",is);b.innerHTML=icon(is?"bookmark-check":"bookmark")+(is?(mode==="review"?"已掌握？":"已标记"):"不熟悉");
    b.onclick=()=>{unknown.has(i)?unknown.delete(i):unknown.add(i);save();render(i)};el.append(row);
  }
  if(!sel.length){const p=document.createElement("p");p.className="empty";p.textContent="目前没有待复习的词条。";el.append(p)}
  $("pages").replaceChildren(...Array.from({length:total},(_,i)=>new Option((i+1)+" / "+total,i,false,i===current)));
  $("prev").disabled=current===0;$("next").disabled=current>=total-1;
  $("confirm").innerHTML=mode==="review"?icon("arrow-left")+"返回测试":seen.size===last?icon("file-down")+"下载已储备词汇 PDF":icon("check")+(seen.has(page)?"继续未测页":"确认本页并继续");
  $("confirm").disabled=busy;$("pdf").disabled=!seen.size||busy;$("pdfnote").textContent="仅导出已确认页中未标记的 "+k.toLocaleString()+" 个词条。";
  if(focusIndex!==undefined)el.querySelector('[data-index="'+focusIndex+'"]')?.focus({preventScroll:true});
}
function move(p){mode==="test"?page=p:rp=p;save();render();goTop()}
$("pages").onchange=e=>move(Number(e.target.value));$("prev").onclick=()=>move((mode==="test"?page:rp)-1);$("next").onclick=()=>move((mode==="test"?page:rp)+1);
function switchTo(m){mode=m;rp=0;render();goTop()}$("review").onclick=()=>switchTo("review");$("test").onclick=()=>switchTo("test");
$("confirm").onclick=()=>{if(mode==="review")return switchTo("test");if(seen.size===last)return makePDF();seen.add(page);
 if(seen.size===last){save();render();goTop();return makePDF()}let p=(page+1)%last;while(seen.has(p))p=(p+1)%last;move(p)};
$("bankinfo").textContent="7,981 项：7,504 个 ECDICT 标记的 GRE 词头、314 个学术阅读补充词及 163 个词组。";
$("credits").textContent="该词表不是 ETS 官方词表。只在确认本页后，未标记的词条才计入已储备。";
$("licenses").textContent=NOTICES;$("more").onclick=()=>$("settings").showModal();$("close").onclick=()=>$("settings").close();
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),120000)}
$("backup").onclick=()=>download(new Blob([JSON.stringify(pack())],{type:"application/json"}),"词序学习进度.json");
$("restore").onclick=()=>$("file").click();$("file").onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const s=JSON.parse(await f.text());if((seen.size||unknown.size)&&!window.confirm("用导入的进度替换当前浏览器中的进度？"))return;unpack(s);save();$("settings").close();switchTo("test");say("进度已导入")}catch{say("无法导入：文件不是本版本的有效进度。")}finally{e.target.value=""}};
async function makePDF(){
  if(busy||!seen.size)return;busy=true;render();const btn=$("settings").open?$("pdf"):$("confirm");const old=btn.textContent;btn.textContent="正在生成 PDF…";
  try{
    await new Promise(r=>setTimeout(r,30));
    await loadPDFTools();const doc=await PDFLib.PDFDocument.create();doc.registerFontkit(fontkit);doc.setTitle("已储备词汇");
    const bytes=Uint8Array.from(atob(FONT64),c=>c.charCodeAt(0)),font=await doc.embedFont(bytes), ink=PDFLib.rgb(.12,.19,.16);
    const labels=known(),width=(t,n)=>font.widthOfTextAtSize(t,n),write=(p,s,x,y,n)=>p.drawText(s,{x,y,size:n,font,color:ink});
    let sheet,y,n=0;
    function newPage(){sheet=doc.addPage([595,842]);n++;write(sheet,"已储备词汇",42,786,22);write(sheet,"GRE   /   "+labels.length+" 个词条",42,761,10);write(sheet,String(n),532,30,9);y=724}
    function wrap(s,w,sz){const result=[];let buf="";for(const tok of s.match(/[A-Za-z0-9'-]+|[^A-Za-z0-9'-]/gu)||[]){if(buf&&width(buf+tok,sz)>w){result.push(buf.trimEnd());buf=""}buf+=tok}result.push(buf.trimEnd());return result}
    newPage();
    for(let j=0;j<labels.length;j++){const [e,c]=WORDS[labels[j]],left=wrap(e,175,11),right=wrap(c.replace(/\s+/g," "),292,10),h=15*Math.max(left.length,right.length)+8;
      if(y-h<45)newPage();left.forEach((v,i)=>write(sheet,v,42,y-i*15,11));right.forEach((v,i)=>write(sheet,v,241,y-i*15,10));y-=h;
      if(j&&j%250===0){btn.textContent="正在排版 "+j+" / "+labels.length;await new Promise(r=>setTimeout(r,0))}
    }
    sheet=doc.addPage([595,842]);write(sheet,"词表来源与许可",42,785,18);y=754;
    for(const line of DICTLICENSE.split("\n")){for(const l of wrap(line,507,8)){if(y<45){sheet=doc.addPage([595,842]);y=787}write(sheet,l,42,y,8);y-=11}}
    const out=await doc.save();download(new Blob([out],{type:"application/pdf"}),"已储备词汇.pdf");say("已生成 "+labels.length+" 个已储备词条的 PDF")
  }catch(err){console.error(err);say("PDF 生成失败，进度已保留。请重试。")}finally{busy=false;btn.textContent=old;render()}
}
$("pdf").onclick=makePDF;render();
